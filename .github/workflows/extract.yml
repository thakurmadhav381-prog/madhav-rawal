name: Extract Deployment Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and update repo root
        run: |
          mkdir -p temp_extract
          unzip -o madhav-portfolio-GEMINI-deployment-package.zip -d temp_extract
          echo "=== Content of temp_extract ==="
          ls -la temp_extract
          
          if [ -d temp_extract/madhav-portfolio-GEMINI-deployment-package ]; then
            cp -r temp_extract/madhav-portfolio-GEMINI-deployment-package/* .
          elif [ $(ls -1 temp_extract | wc -l) -eq 1 ] && [ -d temp_extract/* ]; then
            cp -r temp_extract/*/* .
          else
            cp -r temp_extract/* .
          fi
          
          rm -rf temp_extract
          echo "=== Content of root after extraction ==="
          ls -la
          
          if [ -f GEMINI-DEPLOY-INSTRUCTIONS.txt ]; then
            echo "=== GEMINI-DEPLOY-INSTRUCTIONS.txt ==="
            cat GEMINI-DEPLOY-INSTRUCTIONS.txt
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract deployment package contents to root" || echo "No changes"
          git push
